name: Deploy the edge functions

# The edge functions (supabase/functions) deploy from main, as the app does through Vercel (D-259).
# scripts/functions/deploy.mjs generates the mail catalogue the functions are built with
# (messages/*.json and each market's legal pack, D-257), type-checks all five, and deploys them through
# the Management API.
#
# Needs one repository secret, SUPABASE_ACCESS_TOKEN: a Supabase personal access token with access to
# the project (Supabase › Account › Access Tokens; GitHub › Settings › Secrets and variables › Actions).
# Without it the check still runs and the deploy step says, in the summary, that nothing was deployed;
# the workflow does not turn red, because a missing secret is a setup step, not a broken commit.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'messages/**'
      - 'lib/i18n/respondent-ui.json'
      - 'lib/i18n/survey-source.json'
      - 'lib/flags.signed-off.json'
      - 'scripts/lib/locales.mjs'
      - 'lib/i18n/locales.ts'
      - 'scripts/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and type-check
        run: node scripts/functions/deploy.mjs --check
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set: nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          node scripts/functions/deploy.mjs | tee -a "$GITHUB_STEP_SUMMARY"
