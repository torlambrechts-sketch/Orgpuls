name: Fold approved texts into messages

# Weekly (X-090): the bokmål and English texts approved in admin › Translations are written into
# messages/*.json by scripts/i18n/fold-overrides.mjs and proposed as one pull request, so the files
# stay the source. Nothing in the database changes: an override records the file text it replaced
# (0109), and once this lands the files win.
#
# Needs one repository secret, SUPABASE_ANON_KEY: the project's anon (publishable) key, which the
# public site already ships. Without it the job fails and says so.
#
# A pull request opened with the workflow's own token does not start other workflows, so the checks
# the fold can affect run here before it is opened; CI runs in full when it is merged to main.

on:
  schedule:
    # Mondays 05:41 Oslo (03:41 UTC in summer, 04:41 in winter: GitHub's cron is UTC)
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-fold
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fold approved overrides into messages/
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/i18n/fold-overrides.mjs > "$RUNNER_TEMP/fold.md"

      - name: Anything to propose?
        id: diff
        run: |
          if git diff --quiet -- messages/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to fold: every approved text is already in messages/."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- messages/
          fi

      - name: Check the folded files
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run -s verify:i18n
          npx vitest run tests/unit/platform-package.test.ts tests/unit/site-sheet.test.ts tests/unit/plurals.test.ts

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=i18n/fold-overrides
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add messages/no.json messages/en.json
          git commit -q -m "i18n: fold approved texts into messages/ ($(date -u +%Y-%m-%d))" -m "Generated by .github/workflows/i18n-fold.yml (X-090)."
          # the branch is this workflow's own: each run replaces it with this week's fold
          git push -f origin "$branch"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/fold.md"
          else
            gh pr create --base main --head "$branch" --title "i18n: fold approved texts into messages/" --body-file "$RUNNER_TEMP/fold.md"
          fi
