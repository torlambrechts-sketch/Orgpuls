name: Apply hosted migrations

# Hosted migrations go through the Supabase MCP's apply_migration, with the committed file verbatim and
# named after it (CLAUDE.md, deployment playbook). The MCP wraps the Management API; this workflow is the
# same call made from a runner with the repository's SUPABASE_ACCESS_TOKEN (the secret
# .github/workflows/functions.yml deploys with), for a session whose own token the API refuses.
# scripts/db/apply-hosted.mjs refuses a name the project already lists, applies the named files in the
# order given, stops at the first failure, and prints the project's list before and after. The optional
# check is one SELECT, printed into the summary, so the run proves what it changed.
#
# Dispatch it with the names of the files in supabase/migrations, without .sql, in order:
#   migrations: 0235_german_platform_language 0236_market_de 0237_german_survey_language

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: 'Migration file names without .sql, in order, separated by spaces'
        required: true
        type: string
      check_sql:
        description: 'One read-only SELECT to run afterwards and print (the definitions the migration changed)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hosted-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set: nothing applied." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set -o pipefail
          # the names are validated by the script (NNNN_snake_case, a file in supabase/migrations)
          # shellcheck disable=SC2086
          node scripts/db/apply-hosted.mjs $MIGRATIONS | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check
        if: ${{ always() && inputs.check_sql != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHECK_SQL: ${{ inputs.check_sql }}
        run: |
          set -o pipefail
          node scripts/db/apply-hosted.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"
