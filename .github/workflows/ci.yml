name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, i18n, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # every industry module file under modules/ must parse (lib/modules/schema.ts)
      - run: npm run -s modules:validate

      # The failure helpers and the one-organisation rule. Small functions, each the
      # difference between a failure the product reports and one it renders as the truth.
      - name: Unit tests
        run: npm test

      # Key parity and ICU placeholder parity between no and en. Neither is a type
      # error and neither fails a build, so a missing key renders as `namespace.key`
      # on a screen nobody happened to open in that language.
      - name: i18n parity
        run: npm run verify:i18n

      - name: Build
        run: npx next build
        env:
          # Build-time only. Every page that reads data is force-dynamic, so nothing
          # real is fetched here; these exist because the Supabase client constructor
          # requires them.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY || 'placeholder' }}

  invariants:
    name: security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A pinned release, not `latest`: resolving `latest` asks the GitHub API, whose rate limit
      # failed this job before any test ran (PR #2, 2026-09-27). 2.118.0 is what the QA stack
      # runs (npm run qa:up). Raise it on purpose, together with the PostgREST step below.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      # PostgREST v16.2, which the latest CLI release (v2.117.0) pins, checks a token's `iat`
      # against a cached clock that some of its threads stop refreshing once the server has
      # sat idle (the auto-update defect, PostgREST/postgrest#5196). The first request such
      # a thread serves after the stack has waited through `next build` is refused with
      # PGRST303 "JWT issued at future" whatever the token says, and a retry on the same
      # kept-alive connection reaches the same thread -- which is how the smoke job went red
      # twice on 2026-09-23 with every screen rendered (D-45). v16.3 (2026-09-11) reads the
      # system clock on every request. The CLI's develop branch pins v16.3 but no release
      # carries it yet, and config.toml cannot name an image, so the fixed image is put
      # under the tag the CLI asks for: it inspects that local name before it pulls. The
      # step does nothing once the CLI pins v16.3 or later; delete it then.
      - name: Run PostgREST v16.3 under the tag the CLI pins
        run: |
          pin=$(timeout 60 supabase services 2>/dev/null | grep -i postgrest | grep -o -m1 'v[0-9][0-9.]*' || true)
          echo "the CLI pins PostgREST ${pin:-(unreadable; assuming v16.2)}"
          pin=${pin:-v16.2}
          case "$pin" in
            v16.0|v16.1|v16.2) ;;
            *) echo "past v16.2 -- nothing to do, and this step can go"; exit 0 ;;
          esac
          fixed=
          for attempt in 1 2 3; do
            for candidate in public.ecr.aws/supabase/postgrest:v16.3 postgrest/postgrest:v16.3; do
              if docker pull -q "$candidate" >/dev/null 2>&1; then fixed=$candidate; break 2; fi
            done
            sleep $((attempt * 15))
          done
          if [ -z "$fixed" ]; then
            echo "::warning::could not pull PostgREST v16.3; the smoke job runs on v16.2 and may meet PGRST303"
            exit 0
          fi
          for registry in ghcr.io public.ecr.aws; do
            docker tag "$fixed" "$registry/supabase/postgrest:$pin"
          done
          echo "$fixed is now tagged $pin for the CLI"

      # The images come from a public registry, and ghcr.io has refused this runner's pulls
      # with "toomanyrequests" twice in a row (2026-09-23) before a single test ran. So a
      # failed start is retried with backoff, and the retries pull from Supabase's other
      # official registry, public.ecr.aws. Only the image pull is retried: a failure after
      # the containers are up still fails here, on the last attempt.
      - name: Start local Supabase
        run: |
          services=realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
              echo "start failed; retry $attempt of 4 from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
              supabase stop --no-backup >/dev/null 2>&1 || true
              sleep $((attempt * 20))
            fi
            supabase start -x "$services" && exit 0
          done
          exit 1

      # Proves every migration applies from scratch, in order, against an empty
      # database -- which is the only way to know the twelve of them still compose.
      - name: Apply migrations
        run: supabase db reset

      # Industry modules (0067) are reference data written from modules/*/v*.json, the single
      # source of truth for their wording. The file must parse, and the registry rows come from
      # it, before anything that reads them runs.
      - name: Seed the question modules
        run: |
          npm ci
          npm run -s modules:validate
          npm run -s modules:seed > /tmp/modules.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f /tmp/modules.sql

      # The fixture is generated, not stored, so this also proves the generator and
      # the schema have not drifted apart.
      - name: Seed the design fixture
        run: |
          node scripts/seed/design-fixture.mjs > /tmp/fixture.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f /tmp/fixture.sql

      # The demo organisation (Demobedriften AS) is seeded next to the fixture, before the
      # wheel turns and before the suites run, so every invariant below holds with a
      # second, larger organisation in the database — and so the generator's own check,
      # that every figure its notes quote is the figure its answers produce, runs on every
      # push. The demo login does not exist here; its membership statements match nothing.
      - name: Seed the demo organisation
        run: |
          node scripts/seed/demo-org.mjs > /tmp/demo.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f /tmp/demo.sql

      # The fixture seeds the wheel switched on but not yet turned, so a fresh database
      # has a scheduler that has never run. One tick brings it to the state the hosted
      # project is in and the suites assume: the coming rounds planned, the notification
      # ladder queued. It is also the only place the scheduler is exercised from cold --
      # wheel_invariants.sql asserts that a SECOND tick changes nothing, which proves
      # idempotence and says nothing at all about the first.
      - name: Wind the wheel once
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c "select opened, closed, queued, planned from app.wheel_tick()"

      # Every result RPC is gated on app.is_org_member(), so without a signed-in user
      # they all return not_available and the checks below would pass on nothing.
      - name: Create the local account
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/local_account.sql

      # The numbers the design prints must come out of the database: every closed round's
      # index, response rate and "Anbefaler oss", the nine-factor history, the Varmekart's
      # team values and which groups the release rule withholds. If a migration or the
      # generator changes in a way that moves them, this fails here rather than in a
      # screenshot three screens later. The file checks explicitly that the RPCs answered,
      # so a refusal cannot pass as "nothing drifted".
      - name: Check the design's own figures
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/design_figures.sql

      # k-anonymity, anonymity-by-absence, token replay, expiry, append-only answers,
      # department scoping, the grant surface, what a refused write returns, and the one
      # write path into the product.
      # Every row must report pass = true; each file raises if any does not.
      #
      # The list is a glob rather than nine named steps on purpose: a suite added in a
      # later migration is run here the moment it is committed, instead of the day
      # somebody notices it was never wired up. local_account.sql is not matched -- it is
      # a fixture, not a suite, and it already ran above.
      - name: Security invariants
        run: |
          # every suite runs and the step fails at the end, so one red suite hides no other (AUD-15)
          failed=""
          for suite in supabase/tests/*_invariants.sql; do
            echo "== $suite"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "$suite" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

      - name: supabase db lint
        run: supabase db lint --level warning

      # /audit's catalog half (.claude/skills/audit): no table without RLS, no readable answer
      # table, no definer without a search_path, the k floor, no linkage column on responses, and
      # no public entry point or direct client write that allowlist.json has not reviewed
      - name: Security audit (catalog)
        run: node scripts/audit/wiring.mjs --security-only --db "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      # ------------------------------------------------------------------ smoke
      # Every signed-in screen, against the database built above, as the local account.
      #
      # This is the gate D-40 needed. A migration added a second foreign key, PostgREST
      # refused an embed, and Tiltak rendered "Ingen tiltak" over seven measures -- and
      # every gate passed, because the SQL suites test the database, tsc and the build
      # never run a query, and nothing else looked at a screen. Every read and write now
      # logs its failure as [read], [write] or [org] (lib/supabase/read.ts, write.ts,
      # lib/org/current.ts), so a screen that silently lost its data leaves a line here,
      # and any such line fails the job.
      #
      # The credential is local_account.sql's, which exists only in this throwaway
      # database and is already public in the repository for that reason.
      - name: Build against the local database
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" npx next build

      - name: Smoke every screen
        env:
          ORGPULS_DEV_EMAIL: dev.orgpuls@nordvik.example
          ORGPULS_DEV_PASSWORD: orgpuls-local-only
        run: |
          npx playwright-core install chromium
          npx next start -p 3000 > smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/logg-inn && break; sleep 1; done
          node scripts/verify/shoot.mjs --out artifacts/smoke \
            /innsikt /malinger /kommentarer /tiltak /oppsett /resultater "/malinger?fane=arshjul" \
            /hjelp /integrasjoner /rapport /maleoppsett
          # the same screens at phone width: nothing may scroll sideways or squeeze its text
          # into a column a word wide (D-50). The marketing pages need no sign-in.
          node scripts/verify/mobile.mjs --out artifacts/mobile / /registrer /logg-inn
          node scripts/verify/mobile.mjs --signin --out artifacts/mobile \
            /innsikt /malinger /kommentarer /tiltak /oppsett /resultater "/malinger?fane=arshjul" \
            /hjelp /integrasjoner /rapport /maleoppsett
          if grep -E '\[(read|write|org|middleware)\] ' smoke.log; then
            echo "::error::a screen logged a failed read or write -- see the lines above"
            exit 1
          fi
          echo "no screen logged a failure"

      # ---------------------------------------------------------- respondent flow
      # The survey as a respondent meets it (multilingual-gap-analysis, queue item 6): the QA
      # harness's Playwright suite, on the Lumio QA tenant, at 390, 360 and 320 px, in every
      # language the QA stack offers (bokmål, English), and once more at 320 px under the
      # pseudo-locale (scripts/i18n/pseudo.mjs: accented, ~40 % longer, bracketed).
      #
      # Here, not in a job of its own, because everything it needs is already on this runner:
      # the local Supabase built from the migrations, the modules and the fixtures, and a build
      # made against that same stack. A separate job would pull the Supabase images a second
      # time -- the step the registries' rate limits have already failed twice (above) -- and
      # build the app a second time, for about eight minutes of runner and a second chance to
      # go red on a pull. Reusing the smoke build is sound because the respondent pages are
      # dynamic and the QA flags are read per request (lib/flags.ts); the QA server only needs
      # its own environment, which scripts/qa/env.mjs gives it. It adds ~3 minutes to this job.
      #
      # The gates: every run reaches the done screen; on every screen `lang` is exactly the
      # rendered language's BCP 47 tag (nb, en); axe finds no serious or critical violation
      # beyond qa/known-issues.json; no console error; nothing scrolls sideways or clips; and
      # the one request a submission makes carries no lang or locale key. Screenshots are
      # artifacts, not baselines: the pixel baselines (qa/baselines) depend on this machine's
      # fonts and rasteriser and stay a local gate (npm run qa:visual).
      - name: Make the stack the QA stack
        run: |
          db=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # the same as scripts/qa/up.sh, after the SQL suites have run: this database is now
          # the QA stack, and the registry's English rows exist for the Lumio seed to approve
          # a database-level setting of a custom parameter needs a superuser: in Supabase's image
          # that is supabase_admin (same password as postgres locally), not postgres
          psql "${db/postgres:postgres@/supabase_admin:postgres@}" -q -v ON_ERROR_STOP=1 -c "alter database postgres set app.environment = 'qa'"
          npm run -s i18n:registry | psql "$db" -q -v ON_ERROR_STOP=1

      - name: Respondent flow (390, 360, 320 px x nb, en; pseudo-locale at 320 px)
        env:
          # serve the build the smoke step made (scripts/qa/env.mjs), not a second one
          QA_DIST_DIR: .next
          QA_STEP: ci
        run: |
          npx playwright install chromium
          # e2e.mjs applies the Lumio seed before and after the run (scripts/qa/seed.mjs)
          npm run e2e -- --project mobile --project small --project tiny --project pseudo --grep '@flow|@pseudo|@invariants'

      # The page map (X-090): admin › Translations reviews the site page by page from
      # lib/i18n/site-pages.json. The same build is served in keys mode (lib/i18n/keyed.ts) and
      # every public page crawled: a page showing a text its entry lacks, or a map naming a text
      # messages/ no longer has, fails here. `node scripts/i18n/page-map.mjs` regenerates it.
      - name: Page map
        env:
          QA_DIST_DIR: .next
        run: node scripts/i18n/page-map.mjs --check

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respondent-flow
          path: test-results/
          if-no-files-found: ignore

      - name: Server log
        if: always()
        run: cat smoke.log 2>/dev/null || true

      # The smoke shots are the only capture of every screen against a database built from
      # the migrations, so they are kept: the pixel tooling can be pointed at them.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: artifacts/
          if-no-files-found: ignore
